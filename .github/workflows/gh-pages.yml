name: Deploy web (PWA) to GitHub Pages

on:
  # NOTE: no `paths` filter on purpose — it evaluates unreliably for tag
  # pushes, and this workflow is cheap (bun install + vite build, no Rust).
  push:
    branches:
      - main
    tags:
      # Version tags deploy the PWA alongside the Tauri release (release.yml).
      - 'v*.*.*'
  workflow_dispatch:

# Never cancels/interferes with Tauri release builds (release.yml) or
# Tauri PR checks (test-build.yml) — distinct concurrency group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # [DESKTOP ONLY] skips the Pages build/deploy. workflow_dispatch always runs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, '[DESKTOP ONLY]') &&
        !contains(github.event.pull_request.title, '[DESKTOP ONLY]') &&
        !contains(github.event.pull_request.body, '[DESKTOP ONLY]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build web (PWA, custom domain root)
        env:
          BASE_PATH: ''
          ENABLE_PWA: 'true'
          PWA_ORIGIN: 'https://time.alpharency.com'
        run: bun run build

      # adapter-static is configured with fallback 'index.html' (Tauri canonical).
      # GitHub Pages needs `404.html` for SPA deep-link fallback, so copy it here.
      # The PWA manifest <link> is injected into every prerendered HTML here:
      # it cannot live in src/app.html because the prerender crawler follows it
      # and 404s in Tauri builds (which ship no manifest), failing `bun run build`.
      # Tauri builds are unaffected — they never run this step.
      # NOTE: custom domain (time.alpharency.com) serves from the site ROOT,
      # so BASE_PATH is '' and the manifest href is /manifest.webmanifest.
      # static/CNAME (time.alpharency.com) is copied to build/CNAME by
      # adapter-static to keep the custom domain attached on every deploy.
      - name: Add Pages SPA fallback + manifest link
        env:
          BASE_PATH: ''
        run: |
          cp build/index.html build/404.html
          BASE_PREFIX="${BASE_PATH:-}"
          LINK="<link rel=\"manifest\" href=\"${BASE_PREFIX}/manifest.webmanifest\" />"
          # Every prerendered HTML (timer.html, dashboard.html, …) must link the
          # manifest. Android Chrome reports "No manifest detected" on routes
          # that only had the link in index.html / 404.html.
          find build -name '*.html' -print0 | while IFS= read -r -d '' f; do
            if ! grep -q 'manifest.webmanifest' "$f"; then
              sed -i "s|</head>|  ${LINK}\n</head>|" "$f"
            fi
          done
          grep -q 'manifest.webmanifest' build/index.html
          grep -q 'manifest.webmanifest' build/404.html
          test -f build/CNAME || (echo "missing build/CNAME — static/CNAME was not copied" && exit 1)
          grep -q 'time.alpharency.com' build/CNAME
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
