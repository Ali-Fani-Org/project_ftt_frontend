name: Deploy web (PWA) to GitHub Pages

on:
  # NOTE: no `paths` filter on purpose — it evaluates unreliably for tag
  # pushes, and this workflow is cheap (bun install + vite build, no Rust).
  push:
    branches:
      - main
    tags:
      # Version tags deploy the PWA alongside the Tauri release (release.yml).
      - 'v*.*.*'
  workflow_dispatch:

# Never cancels/interferes with Tauri release builds (release.yml) or
# Tauri PR checks (test-build.yml) — distinct concurrency group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # [DESKTOP ONLY] skips the Pages build/deploy. workflow_dispatch always runs.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, '[DESKTOP ONLY]') &&
        !contains(github.event.pull_request.title, '[DESKTOP ONLY]') &&
        !contains(github.event.pull_request.body, '[DESKTOP ONLY]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i --frozen-lockfile

      - name: Build web (PWA, Pages subpath)
        env:
          BASE_PATH: '/project_ftt_frontend'
          ENABLE_PWA: 'true'
          PWA_ORIGIN: 'https://ali-fani.github.io'
        run: bun run build

      # adapter-static is configured with fallback 'index.html' (Tauri canonical).
      # GitHub Pages needs `404.html` for SPA deep-link fallback, so copy it here.
      # The PWA manifest <link> is injected into both entry shells here too: it
      # cannot live in src/app.html because the prerender crawler follows it and
      # 404s in Tauri builds (which ship no manifest), failing `bun run build`.
      # Tauri builds are unaffected — they never run this step.
      - name: Add Pages SPA fallback + manifest link
        env:
          BASE_PATH: '/project_ftt_frontend'
        run: |
          cp build/index.html build/404.html
          LINK="<link rel=\"manifest\" href=\"${BASE_PATH}/manifest.webmanifest\" />"
          for f in build/index.html build/404.html; do
            sed -i "s|</head>|  ${LINK}\n</head>|" "$f"
          done
          grep -q 'manifest.webmanifest' build/index.html && grep -q 'manifest.webmanifest' build/404.html
          touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
