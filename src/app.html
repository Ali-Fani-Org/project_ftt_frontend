<!doctype html>
<html lang="en" data-theme="valentine">
	<head>
		<script>
			// Apply persisted theme before Svelte hydration to avoid flash/backslide
			try {
				const t = localStorage.getItem('theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {
				console.warn('Theme preload failed', e);
			}
			// Chrome on Android fires beforeinstallprompt as soon as the page is
			// installable — often BEFORE Svelte mounts. Capture it here or the
			// in-app Install banner never sees the event.
			window.__pwa = window.__pwa || {};
			window.addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__pwa.deferredPrompt = e;
				window.dispatchEvent(new Event('pwa-install-available'));
			});
			window.addEventListener('appinstalled', function () {
				window.__pwa.deferredPrompt = null;
				window.dispatchEvent(new Event('pwa-installed'));
			});
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Track time, manage tasks and stay in flow." />
		<meta name="theme-color" content="#392117" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="TimeTracker" />
		<!-- Manifest <link> is emitted from +layout.svelte via virtual:pwa-info
		     (PWA builds only) and backfilled into every HTML file by the Pages
		     workflow. It must NOT live here: the prerender crawler follows it
		     and 404s in Tauri builds, which ship no manifest. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
