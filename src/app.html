<!doctype html>
<html lang="en" data-theme="valentine">
	<head>
		<script>
			// Apply persisted theme before Svelte hydration to avoid flash/backslide
			try {
				const t = localStorage.getItem('theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {
				console.warn('Theme preload failed', e);
			}
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Track time, manage tasks and stay in flow." />
		<meta name="theme-color" content="#e11d48" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="TimeTracker" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
